name: Publish H3 model downloader

on:
  push:
    branches: [main]
    paths:
      - "runpod_downloader/**"
      - ".github/workflows/publish-downloader.yml"
  workflow_dispatch:

concurrency:
  group: publish-h3-downloader-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=h3-model-downloader
            type=sha,prefix=downloader-sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod_downloader/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
